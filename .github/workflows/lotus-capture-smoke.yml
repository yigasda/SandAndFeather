name: Wind basin exact reproduction

on:
  pull_request:
    branches: [recovery/lotus-182b59d0-transfer-20261021]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/lotus-capture-smoke.yml']

permissions:
  contents: read

jobs:
  browser-capture:
    if: github.head_ref == 'ci/lotus-tabs-capture-20261022' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GAME_SHA: c213224d865466a0252bc94bdc72785192e760a7
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the approved game commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: c213224d865466a0252bc94bdc72785192e760a7
          path: game
          persist-credentials: false
          fetch-depth: 3
      - name: Prepare generator dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-output
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-pil python3-scipy python3-shapely
          cat > hash-runtime.cjs <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');const ROOT=path.resolve('game'),files=[];function scan(dir,ext){for(const ent of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,ent.name);if(ent.isDirectory())scan(p,ext);else if(ext.test(ent.name))files.push(p);}}scan(path.join(ROOT,'src'),/\.js$/);scan(path.join(ROOT,'data/maps'),/\.json$/);files.push(path.join(ROOT,'data/scene-art.json'),path.join(ROOT,'tools/st-test/portal-walk.cjs'));const hash=crypto.createHash('sha256');for(const file of files.sort())hash.update(path.relative(ROOT,file)).update(fs.readFileSync(file));const result={runtimeAndTestSha256:hash.digest('hex'),files:files.length};console.log(JSON.stringify(result));if(result.runtimeAndTestSha256!=='3f81c4f174d7c9694adc8dcd4787a7714101ea5138d76bdaf54d8d035c53a8be'||result.files!==125)process.exit(1);
          JS
          node hash-runtime.cjs > full-output/hash-before.json
      - name: Reproduce and verify exact committed runtime
        shell: bash
        run: |
          set -euo pipefail
          (cd game && python3 -u tools/maps/desert.py --review-only desert_buried_temple desert_wind_basin) > full-output/generator.log 2>&1
          git -C game diff --exit-code -- data src docs/art/map-expansion/desert-10.png > full-output/reproducibility.log
          (cd game && python3 tools/maps/check-wind-basin-connection.py && python3 tools/maps/check-archive-connection.py) > full-output/invariants.log 2>&1
          node hash-runtime.cjs > full-output/hash-after.json
          cmp full-output/hash-before.json full-output/hash-after.json
          git -C game rev-parse HEAD > full-output/source.txt
          git -C game status --short > full-output/status.txt
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wind-basin-exact-reproduction
          path: full-output/**
          if-no-files-found: error
          retention-days: 1
