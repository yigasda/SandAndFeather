name: Lotus landscape tabs capture

on:
  pull_request:
    branches: [recovery/lotus-182b59d0-transfer-20261021]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/lotus-capture-smoke.yml']

permissions:
  contents: read

jobs:
  browser-capture:
    if: github.head_ref == 'ci/lotus-tabs-capture-20261022' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GAME_SHA: 3010c502ad89a2a76b9a1ea78118529b9166532d
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the approved game commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3010c502ad89a2a76b9a1ea78118529b9166532d
          path: game
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare disposable official SillyTavern and browser driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          mkdir -p capture-output driver
          test "$(git -C game rev-parse HEAD)" = "$GAME_SHA"
          node --input-type=module --check < game/src/ui/lotus-menu.js
          node --input-type=module --check < game/src/ui/menu-header.js
          mkdir sillytavern
          git -C sillytavern init
          git -C sillytavern remote add origin https://github.com/SillyTavern/SillyTavern.git
          GIT_LFS_SKIP_SMUDGE=1 git -C sillytavern fetch --depth 1 origin 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          GIT_LFS_SKIP_SMUDGE=1 git -C sillytavern checkout --detach 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          git -C sillytavern rev-parse HEAD > capture-output/sillytavern-sha.txt
          (cd sillytavern && npm install --no-audit --no-fund)
          (cd driver && npm install --no-audit --no-fund --ignore-scripts --save-exact playwright-core@1.56.1)
          EXT="$PWD/sillytavern/data/default-user/extensions/SandAndFeather"
          mkdir -p "$EXT"
          cp -r game/src game/data "$EXT/"
          cp game/index.js game/style.css game/manifest.json "$EXT/"
          export EXT
          python3 - <<'PY'
          import os, re, shutil
          from pathlib import Path
          root, dest = Path('game'), Path(os.environ['EXT'])
          assets = set()
          for path in (root/'data').rglob('*'):
              if path.is_file() and path.suffix in {'.json','.js','.txt'}:
                  assets.update(re.findall(r'"\.\./(docs/[^"]+)"', path.read_text(errors='replace')))
          for name in sorted(assets):
              source = root / name
              if source.is_file():
                  target = dest / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          PY
      - name: Capture one actual Lotus bond screen in the disposable runtime
        shell: bash
        run: |
          set -euo pipefail
          (cd sillytavern && node server.js --port 8000 --listen false > ../capture-output/server.log 2>&1) &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 90); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          cat > driver/capture.cjs <<'JS'
          const {chromium} = require('playwright-core');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const out = path.resolve('capture-output');
          const base = '/scripts/extensions/third-party/SandAndFeather/';
          const metadata = {
            purpose:'Landscape tab changed-source captures and focused interactions, not full regression',
            game_sha:process.env.GAME_SHA, harness_sha:process.env.HEAD_SHA,
            sillytavern_sha:fs.readFileSync(path.join(out,'sillytavern-sha.txt'),'utf8').trim(),
            run_id:process.env.GITHUB_RUN_ID, viewport:{width:1842,height:854}, device_scale_factor:1,
            user_save_access:false, disposable_default_data:true, game_code_modified:false, korean_fallback_font:'Ubuntu fonts-noto-cjk',
            seeded_records:false, seeded_inventory:false, ai_generation_requests:[],
            blocked_external_requests:[], page_errors:[], request_failures:[], http_errors:[],
            captured_at_utc:new Date().toISOString(), success:false
          };
          (async()=>{
            let browser, page;
            try {
              browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--disable-background-networking','--no-first-run']});
              metadata.browser=browser.version();
              const context=await browser.newContext({viewport:metadata.viewport,deviceScaleFactor:1});
              await context.route('**/*',async route=>{
                const request=route.request(), url=new URL(request.url());
                if (/\/generate(?:\/|$)|\/chat\/completions(?:\/|$)/.test(url.pathname)) {
                  metadata.ai_generation_requests.push({method:request.method(),url:request.url()});
                  return route.abort();
                }
                if (!['127.0.0.1','localhost'].includes(url.hostname) && !['data:','blob:'].includes(url.protocol)) {
                  metadata.blocked_external_requests.push(request.url());
                  return route.abort();
                }
                return route.continue();
              });
              page=await context.newPage();
              page.setDefaultTimeout(30000);
              page.on('pageerror',e=>metadata.page_errors.push(e.message));
              page.on('requestfailed',r=>metadata.request_failures.push({url:r.url(),error:r.failure()?.errorText}));
              page.on('response',r=>{if(r.status()>=400)metadata.http_errors.push({url:r.url(),status:r.status()});});
              await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>!!window.SillyTavern?.getContext,null,{timeout:60000});
              await page.waitForTimeout(2500);
              const save=page.locator('button:visible, .menu_button:visible',{hasText:/^Save$/});
              await save.first().waitFor({state:'visible',timeout:60000});
              await save.first().click();
              await save.first().waitFor({state:'hidden',timeout:30000});
              await page.waitForFunction(()=>SillyTavern.getContext().characters?.length>0);
              await page.evaluate(()=>{
                const ctx=SillyTavern.getContext();
                const index=ctx.characters.findIndex(c=>/Seraphina/i.test(c.name));
                if(index<0)throw new Error('Disposable default Seraphina character missing');
                ctx.selectCharacterById(index);
              });
              await page.waitForFunction(()=>!!SillyTavern.getContext().chatId);
              await page.waitForSelector('#sf_open',{state:'attached'});
              await page.evaluate(async base=>{
                const settings=await import(base+'src/core/settings.js');
                settings.settings().theme='light'; settings.settings().uiTheme='cozy';
                const win=await import(base+'src/ui/window.js');
                await win.openGame();
                window.toastr?.clear();
              },base);
              metadata.captures=[];
              for (const viewport of [{width:1842,height:854},{width:844,height:390},{width:390,height:844}]) {
                await page.setViewportSize(viewport);
                for (const tab of ['party','quests','map','world']) {
                  if(viewport.width===1842 && tab==='world')continue;
                  await page.evaluate(tab=>document.querySelector('#sf_game').dispatchEvent(new CustomEvent('sf:navigate',{detail:tab})),tab);
                  if(viewport.width>viewport.height && tab!=='world')await page.waitForSelector('.sf_menu_window.sf_lotus_menu[data-lotus-tab="'+tab+'"]');
                  await page.waitForTimeout(800);
                  const geometry=await page.evaluate(async()=>{
                    await document.fonts.ready;
                    const root=document.querySelector('#sf_game');
                    const visible=el=>{const r=el.getBoundingClientRect();const s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';};
                    await Promise.all([...root.querySelectorAll('img')].filter(visible).map(img=>img.decode().catch(()=>{})));
                    const box=el=>{const r=el.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height};};
                    return {
                      cards:[...root.querySelectorAll('.sf_pop_wrap')].map(el=>({classes:el.className,box:box(el),text:el.textContent})),
                      controls:[...root.querySelectorAll('button')].filter(visible).map(el=>({text:el.textContent,label:el.getAttribute('aria-label'),tab:el.dataset.menuTab,lead:el.dataset.lead,companion:el.dataset.companion,box:box(el)})),
                      images:[...root.querySelectorAll('img')].filter(visible).map(el=>({src:el.src,complete:el.complete,width:el.naturalWidth})),
                      canvases:[...root.querySelectorAll('canvas')].filter(visible).map(el=>({classes:el.className,width:el.width,height:el.height,box:box(el)}))
                    };
                  });
                  const name=tab+'-'+viewport.width+'x'+viewport.height+'.png';
                  await page.screenshot({path:path.join(out,name)});
                  const bytes=fs.readFileSync(path.join(out,name));
                  metadata.captures.push({tab,viewport,name,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),geometry});
                }
              }
              metadata.interactions=[];
              const check=(condition,name)=>{metadata.interactions.push({name,pass:!!condition});if(!condition)throw new Error(name);};
              const navigate=async tab=>{
                await page.evaluate(tab=>document.querySelector('#sf_game').dispatchEvent(new CustomEvent('sf:navigate',{detail:tab})),tab);
                if(tab!=='world')await page.waitForSelector('.sf_menu_window.sf_lotus_menu[data-lotus-tab="'+tab+'"]');
              };
              await page.setViewportSize({width:844,height:390});
              await navigate('party');
              for(const tab of ['quests','map','party','quests','party']){
                await page.locator('.sf_menu_window.sf_lotus_menu .sf_menu_nav [data-menu-tab="'+tab+'"]').click();
                await page.waitForSelector('.sf_menu_window.sf_lotus_menu[data-lotus-tab="'+tab+'"]');
                check(await page.locator('.sf_menu_window.sf_lotus_menu').count()===1,'Actual header navigation '+tab+' has one shell');
              }
              await page.locator('.sf_menu_window.sf_lotus_menu button[data-detail="somang"]').click();
              await page.waitForSelector('.sf_character_summary');
              check(await page.locator('.sf_character_summary').count()===1,'Original party detail handler opens character card');
              await page.keyboard.press('Escape');
              await navigate('party');
              await page.locator('.sf_menu_window.sf_lotus_menu .sf_pop_x').click();
              check(await page.locator('.sf_pop_wrap').count()===0,'Close restores world without lingering card');
              await navigate('map');
              check(await page.locator('.sf_bigmap').count()===1,'Map retains one original canvas');
              await page.evaluate(()=>{window.__baselineMap=document.querySelector('.sf_bigmap');});
              await page.setViewportSize({width:390,height:844});
              await page.waitForTimeout(300);
              check(await page.locator('.sf_lotus_menu').count()===0,'Portrait disables scaled shell');
              check(await page.locator('.sf_lotus_menu_column').count()===0,'Portrait unwraps temporary columns');
              check(await page.evaluate(()=>document.querySelector('.sf_bigmap')===window.__baselineMap),'Portrait preserves original canvas identity');
              await page.setViewportSize({width:844,height:390});
              await page.waitForSelector('.sf_menu_window.sf_lotus_menu[data-lotus-tab="map"]');
              check(await page.evaluate(()=>document.querySelector('.sf_bigmap')===window.__baselineMap),'Rotate back preserves original canvas identity');
              await page.evaluate(async base=>{const s=await import(base+'src/core/settings.js'),w=await import(base+'src/ui/window.js');s.settings().uiTheme='classic';w.applyTheme();},base);
              await page.waitForTimeout(300);
              check(await page.locator('.sf_lotus_menu').count()===0,'Classic theme disables Lotus shell');
              check(await page.locator('.sf_lotus_menu_column').count()===0,'Classic theme unwraps columns');
              await page.evaluate(async base=>{const s=await import(base+'src/core/settings.js'),w=await import(base+'src/ui/window.js');s.settings().uiTheme='cozy';w.applyTheme();},base);
              await page.waitForSelector('.sf_menu_window.sf_lotus_menu[data-lotus-tab="map"]');
              check(await page.evaluate(()=>document.querySelector('.sf_bigmap')===window.__baselineMap),'Theme roundtrip preserves original canvas identity');
              await page.keyboard.press('Escape');
              check(await page.locator('.sf_pop_wrap').count()===0,'Escape restores world');
              if(metadata.ai_generation_requests.length)throw new Error('Unexpected generation request blocked');
              metadata.success=true;
            } catch(error) {
              metadata.failure=error.stack||String(error);
              if(page){metadata.page_url=page.url();await page.screenshot({path:path.join(out,'lotus-runtime.png')}).catch(()=>{});}
              process.exitCode=1;
            } finally {
              fs.writeFileSync(path.join(out,'metadata.json'),JSON.stringify(metadata,null,2)+'\n');
              console.log(JSON.stringify({success:metadata.success,failure:metadata.failure,scene:metadata.scene?.box,page_errors:metadata.page_errors}));
              if(browser)await browser.close();
            }
          })();
          JS
          node driver/capture.cjs
      - name: Upload one PNG and diagnostic metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lotus-tabs-after
          path: |
            capture-output/*.png
            capture-output/metadata.json
            capture-output/sillytavern-sha.txt
            capture-output/server.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
