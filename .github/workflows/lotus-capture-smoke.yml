name: Lotus controlled failure diagnosis

on:
  pull_request:
    branches: [recovery/lotus-182b59d0-transfer-20261021]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/lotus-capture-smoke.yml']

permissions:
  contents: read

jobs:
  browser-capture:
    if: github.head_ref == 'ci/lotus-tabs-capture-20261022' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: main
            source: 2e8323ff3a4231bdc2b80f34b29ddab1f475d464
          - variant: final
            source: 7527fb1bd7615e50cba5bb81d63d9dc3bc0da7b1
    env:
      VARIANT: ${{ matrix.variant }}
      GAME_SHA: ${{ matrix.source }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the approved game commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.source }}
          path: game
          persist-credentials: false
          fetch-depth: 1
      - name: Check out identical diagnostic test harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a110404d25e50e54bf5ffbd7da6dddca42a31a42
          path: test-harness
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            tools
            docs/art/map-expansion/desert-connections-review/sanctuary-validated
      - name: Prepare disposable official SillyTavern and browser driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk python3-numpy python3-pil
          mkdir -p capture-output driver
          test "$(git -C game rev-parse HEAD)" = "$GAME_SHA"
          mkdir sillytavern
          git -C sillytavern init
          git -C sillytavern remote add origin https://github.com/SillyTavern/SillyTavern.git
          GIT_LFS_SKIP_SMUDGE=1 git -C sillytavern fetch --depth 1 origin 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          GIT_LFS_SKIP_SMUDGE=1 git -C sillytavern checkout --detach 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          git -C sillytavern rev-parse HEAD > capture-output/sillytavern-sha.txt
          (cd sillytavern && npm install --no-audit --no-fund)
          (cd driver && npm install --no-audit --no-fund --ignore-scripts --save-exact playwright@1.56.1)
          (cd driver && npx playwright install --with-deps chromium ffmpeg)
          CHROMIUM=$(node -e "console.log(require('./driver/node_modules/playwright').chromium.executablePath())")
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
          git -C game fetch --depth 1 origin main:refs/remotes/origin/main
          test "$(git -C game rev-parse origin/main)" = "2e8323ff3a4231bdc2b80f34b29ddab1f475d464"
          EXT="$PWD/sillytavern/data/default-user/extensions/SandAndFeather"
          mkdir -p "$EXT"
          cp -r game/src game/data "$EXT/"
          cp game/index.js game/style.css game/manifest.json "$EXT/"
          export EXT
          python3 - <<'PY'
          import os, re, shutil
          from pathlib import Path
          root, dest = Path('game'), Path(os.environ['EXT'])
          assets = set()
          for path in (root/'data').rglob('*'):
              if path.is_file() and path.suffix in {'.json','.js','.txt'}:
                  assets.update(re.findall(r'"\.\./(docs/[^"]+)"', path.read_text(errors='replace')))
          for name in sorted(assets):
              source = root / name
              if source.is_file():
                  target = dest / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          PY
      - name: Diagnose fresh onboarding and rerun unchanged ultimate test
        shell: bash
        run: |
          set -euo pipefail
          export ST_ROOT="$PWD/sillytavern"
          export NODE_PATH="$PWD/driver/node_modules"
          OUT="$PWD/full-output"
          mkdir -p "$OUT"
          node game/tools/st-test/fakeai.js > "$OUT/fakeai.log" 2>&1 &
          FAKE_PID=$!
          trap 'kill "$FAKE_PID" 2>/dev/null || true' EXIT
          printf 'source=%s\nharness=%s\nbase=%s\nhost=%s\nuser_save_access=false\n' "$GAME_SHA" "$HEAD_SHA" "$(git -C game rev-parse origin/main)" "$(git -C sillytavern rev-parse HEAD)" > "$OUT/provenance.txt"
          (cd "$ST_ROOT" && node server.js --port 8000 --listen false > "$OUT/server.log" 2>&1) &
          for i in $(seq 90); do curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break; sleep 2; done
          cat > driver/onboard.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('node:fs');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/chromium'}),p=await b.newPage();
            await p.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>!!window.SillyTavern?.getContext,null,{timeout:60000});
            await p.waitForTimeout(2500);
            const save=p.locator('button:visible, .menu_button:visible',{hasText:/^Save$/});
            const initial={saveCount:await save.count(),characters:await p.evaluate(()=>SillyTavern.getContext().characters?.length),time:new Date().toISOString()};
            await p.screenshot({path:'full-output/onboarding-before.png'});
            await save.first().waitFor({state:'visible',timeout:60000});
            await save.first().click();
            await save.first().waitFor({state:'hidden'});
            await p.waitForFunction(()=>SillyTavern.getContext().characters?.length>0);
            const final={saveCount:await save.count(),characters:await p.evaluate(()=>SillyTavern.getContext().characters.length),time:new Date().toISOString()};
            fs.writeFileSync('full-output/onboarding.json',JSON.stringify({initial,final},null,2));
            await p.screenshot({path:'full-output/onboarding-after.png'});
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node driver/onboard.cjs
          set +e
          EXT="$ST_ROOT/data/default-user/extensions/SandAndFeather"
          (cd "$EXT" && find src data -type f -print0 | sort -z | xargs -0 sha256sum; sha256sum index.js style.css manifest.json) > "$OUT/runtime-hashes-before.txt"
          printf 'served_game_sha=%s\ndiagnostic_harness_sha=%s\n' "$GAME_SHA" "$(git -C test-harness rev-parse HEAD)" >> "$OUT/provenance.txt"
          node -e "const p=require('playwright');(async()=>{let b=await p.chromium.launch({executablePath:'/usr/bin/chromium'});console.log(b.version());await b.close()})()" > "$OUT/browser-version.txt"
          RESULT=0
          node test-harness/tools/st-test/portal-walk.cjs "$OUT/portal-city" --independent-tiles 1.7472 --city-dwelling --return-trace > "$OUT/portal-city.log" 2>&1 || RESULT=1
          node test-harness/tools/st-test/desert-ult.cjs "$OUT/desert-ult" > "$OUT/desert-ult.log" 2>&1 || RESULT=1
          if [ "$VARIANT" = final ]; then
            node test-harness/tools/art/verify-ui-themes.cjs "$OUT/theme" > "$OUT/theme.log" 2>&1 || RESULT=1
          fi
          (cd "$EXT" && find src data -type f -print0 | sort -z | xargs -0 sha256sum; sha256sum index.js style.css manifest.json) > "$OUT/runtime-hashes-after.txt"
          cmp "$OUT/runtime-hashes-before.txt" "$OUT/runtime-hashes-after.txt" || RESULT=1
          set -e
          if grep -nE '^FAIL|^실패' "$OUT"/*.log > "$OUT/failure-lines.txt"; then RESULT=1; fi
          if [ -f /tmp/st-server.log ]; then cp /tmp/st-server.log "$OUT/server.log"; fi
          printf 'suite_exit=%s\n' "$RESULT" >> "$OUT/provenance.txt"
          exit "$RESULT"
      - name: Upload full-suite evidence without video bulk
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lotus-diagnosis-${{ matrix.variant }}
          path: |
            full-output/**/*.png
            full-output/desert-ult/**/*.png
            full-output/**/*.log
            full-output/**/*.txt
            full-output/**/*.json
            full-output/landscape/**/*.png
            full-output/verify-cozy-ui/**/*.png
            full-output/verify-ui-themes/**/*.png
            full-output/verify-full-map/**/*.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
